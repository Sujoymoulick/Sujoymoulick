<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 40" width="1280" height="40" role="img" aria-label=""><style>
.m{font-family:'SM Mono','Courier New',monospace}.d{font-family:'SM Display',Impact,'Arial Narrow',sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(8px)}}
@keyframes flick{0%,100%{opacity:.07}50%{opacity:.11}93%{opacity:.07}94%{opacity:.16}95%{opacity:.07}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.1s steps(1) infinite}
.scan{animation:roll .6s linear infinite}
.flick{animation:flick 4s infinite}
</style><defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#000"/></pattern><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171717" stroke-width="1"/></pattern></defs><line x1="48" y1="20" x2="1232" y2="20" stroke="#262626" stroke-dasharray="2 6"/><rect x="635.0" y="15" width="10" height="10" fill="#e1251b" transform="rotate(45 640.0 20)"/><rect x="44" y="16" width="8" height="8" fill="#4a4a4a"/><rect x="1228" y="16" width="8" height="8" fill="#4a4a4a"/></svg>